services:
  - type: web
    name: signova-intelligence-studio
    runtime: python
    region: oregon
    # TensorFlow + MediaPipe + OpenCV need roughly 1 GB of RAM once the LSTM is loaded.
    # Render's free plan (512 MB) is likely to run out of memory; see DEPLOYMENT.md.
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
