<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="polyGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="25%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0A1A5C" />
    </linearGradient>
  </defs>

  <!-- Base gradient background -->
  <rect width="1920" height="1080" fill="url(#polyGrad)" />

  <!-- Triangulated Low-Poly Facets with faceted blues -->
  <!-- Top Right Region (Lighter Cyan / Azure) -->
  <polygon points="1920,0 1600,0 1720,220" fill="#00C2FF" fill-opacity="0.85" />
  <polygon points="1600,0 1350,0 1480,240" fill="#0EA5E9" fill-opacity="0.9" />
  <polygon points="1920,0 1720,220 1920,380" fill="#38BDF8" fill-opacity="0.75" />
  <polygon points="1600,0 1720,220 1480,240" fill="#0284C7" fill-opacity="0.8" />
  <polygon points="1720,220 1920,380 1680,480" fill="#0284C7" fill-opacity="0.75" />
  <polygon points="1720,220 1480,240 1680,480" fill="#2563EB" fill-opacity="0.8" />
  <polygon points="1920,380 1920,680 1680,480" fill="#1D4ED8" fill-opacity="0.8" />

  <!-- Top Mid Region -->
  <polygon points="1350,0 1050,0 1200,260" fill="#0284C7" fill-opacity="0.85" />
  <polygon points="1350,0 1200,260 1480,240" fill="#0EA5E9" fill-opacity="0.75" />
  <polygon points="1050,0 780,0 920,250" fill="#1D4ED8" fill-opacity="0.85" />
  <polygon points="1050,0 920,250 1200,260" fill="#2563EB" fill-opacity="0.8" />
  <polygon points="1200,260 1480,240 1380,520" fill="#1E40AF" fill-opacity="0.85" />
  <polygon points="1480,240 1680,480 1380,520" fill="#1D4ED8" fill-opacity="0.8" />
  <polygon points="1680,480 1920,680 1740,780" fill="#1E40AF" fill-opacity="0.85" />
  <polygon points="1680,480 1380,520 1740,780" fill="#1E3A8A" fill-opacity="0.8" />

  <!-- Center Region -->
  <polygon points="780,0 520,0 660,280" fill="#1D4ED8" fill-opacity="0.9" />
  <polygon points="780,0 660,280 920,250" fill="#2563EB" fill-opacity="0.8" />
  <polygon points="920,250 660,280 820,540" fill="#1E40AF" fill-opacity="0.85" />
  <polygon points="920,250 820,540 1200,260" fill="#1E3A8A" fill-opacity="0.8" />
  <polygon points="1200,260 820,540 1080,560" fill="#172554" fill-opacity="0.85" />
  <polygon points="1200,260 1080,560 1380,520" fill="#1E40AF" fill-opacity="0.8" />
  <polygon points="1380,520 1080,560 1280,820" fill="#172554" fill-opacity="0.9" />
  <polygon points="1380,520 1280,820 1740,780" fill="#1E3A8A" fill-opacity="0.85" />
  <polygon points="1740,780 1920,680 1920,1080" fill="#0A1A5C" fill-opacity="0.9" />
  <polygon points="1740,780 1920,1080 1560,1080" fill="#0B1B3A" fill-opacity="0.85" />
  <polygon points="1740,780 1280,820 1560,1080" fill="#0A1A5C" fill-opacity="0.85" />

  <!-- Top Left Region -->
  <polygon points="520,0 240,0 380,290" fill="#1E40AF" fill-opacity="0.9" />
  <polygon points="520,0 380,290 660,280" fill="#1D4ED8" fill-opacity="0.85" />
  <polygon points="240,0 0,0 120,310" fill="#1E3A8A" fill-opacity="0.95" />
  <polygon points="240,0 120,310 380,290" fill="#1E40AF" fill-opacity="0.85" />
  <polygon points="380,290 120,310 260,590" fill="#172554" fill-opacity="0.9" />
  <polygon points="380,290 260,590 660,280" fill="#1E3A8A" fill-opacity="0.85" />
  <polygon points="660,280 260,590 540,580" fill="#172554" fill-opacity="0.85" />
  <polygon points="660,280 540,580 820,540" fill="#1E40AF" fill-opacity="0.85" />

  <!-- Mid Left & Bottom Left Region (Deep Navy #0A1A5C / #0B1B3A) -->
  <polygon points="0,0 0,380 120,310" fill="#0F172A" fill-opacity="0.9" />
  <polygon points="0,380 120,310 260,590" fill="#0A1A5C" fill-opacity="0.95" />
  <polygon points="0,380 0,720 260,590" fill="#0B1B3A" fill-opacity="0.95" />
  <polygon points="260,590 540,580 420,860" fill="#0B1B3A" fill-opacity="0.9" />
  <polygon points="260,590 0,720 420,860" fill="#0A1A5C" fill-opacity="0.95" />
  <polygon points="540,580 820,540 700,840" fill="#0A1A5C" fill-opacity="0.9" />
  <polygon points="540,580 700,840 420,860" fill="#060D24" fill-opacity="0.95" />
  <polygon points="820,540 1080,560 980,830" fill="#0B1B3A" fill-opacity="0.9" />
  <polygon points="820,540 980,830 700,840" fill="#0A1A5C" fill-opacity="0.9" />
  <polygon points="1080,560 1280,820 980,830" fill="#060D24" fill-opacity="0.95" />

  <!-- Bottom Strip Facets -->
  <polygon points="0,720 0,1080 220,1080" fill="#04091A" fill-opacity="0.98" />
  <polygon points="0,720 220,1080 420,860" fill="#060D24" fill-opacity="0.95" />
  <polygon points="420,860 220,1080 520,1080" fill="#0B1B3A" fill-opacity="0.95" />
  <polygon points="420,860 520,1080 700,840" fill="#060D24" fill-opacity="0.95" />
  <polygon points="700,840 520,1080 840,1080" fill="#0A1A5C" fill-opacity="0.95" />
  <polygon points="700,840 840,1080 980,830" fill="#0B1B3A" fill-opacity="0.95" />
  <polygon points="980,830 840,1080 1200,1080" fill="#060D24" fill-opacity="0.95" />
  <polygon points="980,830 1200,1080 1280,820" fill="#0A1A5C" fill-opacity="0.95" />
  <polygon points="1280,820 1200,1080 1560,1080" fill="#0B1B3A" fill-opacity="0.95" />
</svg>
